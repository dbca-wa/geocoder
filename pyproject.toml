[project]
name = "geocoder"
version = "1.0.3"
description = "Lightweight application service to serve an API endpoint to allow full-text searching of addresses."
authors = [{ name = "Ashley Felton", email = "ashley.felton@dbca.wa.gov.au" }]
license = "Apache-2.0"
requires-python = ">=3.13,<4.0"
dependencies = [
  "flask==3.1.3",
  "flask-sqlalchemy==3.1.1",
  "gunicorn[fast]==26.2.0",
  "psycopg[binary,pool]==3.3.6",
  "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
  "ipython>=9.17.1",
  "ipdb>=0.13.13",
  "mixer>=7.2.2",
  "pre-commit>=4.7.0",
  "deptry>=0.25.1",
  "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = false

# Reference: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 140
indent-width = 4

[tool.ruff.lint]
ignore = [
  "E265",   # Block comment should start with #
  "E501",   # Line too long
  "E722",   # Bare except
  "BLE001", # Blind except: https://docs.astral.sh/ruff/rules/blind-except/
]

[tool.deptry]
ignore = ["DEP004"]
[tool.deptry.per_rule_ignores]
DEP002 = ["gunicorn", "psycopg"]
DEP003 = ["sqlalchemy"]
