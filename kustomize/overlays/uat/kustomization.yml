apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -uat
resources:
  - ../../base
  - ingress.yml
  - pdb.yml
secretGenerator:
  - name: geocoder-env
    type: Opaque
    envs:
      - .env
generatorOptions:
  disableNameSuffixHash: true
labels:
  - includeSelectors: true
    pairs:
      variant: uat
patches:
  - path: webserver_patch.yml
  - path: webserver_hpa_patch.yml
  - path: service_patch.yml
